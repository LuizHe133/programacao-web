<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Feedback</title>
</head>
<body>
  <h1>Enviar Feedback</h1>
  <form action="/feedbacks/enviar" method="post">
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" title="Campo para inserir seu nome" required><br><br>

    <label for="comentario">Comentário:</label><br>
    <textarea id="comentario" name="comentario" placeholder="Escreva seu feedback" title="Campo para inserir seu comentário" rows="4" required></textarea><br><br>

    <button type="submit">Enviar</button>
  </form>
  <p><a href="/feedbacks/lista">Ver lista de feedbacks</a></p>
</body>
</html>
